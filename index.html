<!DOCTYPE html>
<html class="v1" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festival Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Elrendezés: fejléc + szűrősáv + egy nézet (térkép / felfedezés / naptár / terv / profil) + alsó fül-sor */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#0e1726; --muted:#5b6678; --line:#dde2ea;
  --accent:#ff5a1f; --accent-ink:#ffffff; --good:#12805c; --warn:#a15c00;
  --sea:#cfe3f1; --land:#f8f6ef; --landline:#b9c3cf;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e141b; --surface:#17202b; --ink:#eef2f7; --muted:#9aa7b8; --line:#273445;
    --accent:#ff6a35; --accent-ink:#1a0a03; --good:#46c79a; --warn:#f0b04a;
    --sea:#13202e; --land:#243447; --landline:#344a63; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#17202b; --ink:#eef2f7; --muted:#9aa7b8; --line:#273445;
  --accent:#ff6a35; --accent-ink:#1a0a03; --good:#46c79a; --warn:#f0b04a;
  --sea:#13202e; --land:#243447; --landline:#344a63; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;overscroll-behavior:none}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
.top{padding:10px 14px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top h1{font-family:var(--font-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.top small{color:var(--muted);font-size:.75rem}
#filters{padding:4px 14px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#months{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#months .chip{flex:0 0 auto}
input[type=search],input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
#q{flex:1 1 200px}
select{flex:1 1 120px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:.8rem;color:var(--muted)}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
.scroll{height:100%;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
/* Generált illusztrációk (nem valódi fotók) */
.date.art{position:relative;overflow:hidden;background:none;min-height:58px}
.date.art svg{position:absolute;inset:0;width:100%;height:100%}
.date.art b,.date.art span{position:relative;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.banner svg{width:100%;height:auto;display:block;border-radius:14px}
.sw .banner svg{height:70px;width:100%}.sw .clamp{-webkit-line-clamp:2}
.sw{padding:14px;gap:6px}
.sw .price{margin:2px 0;font-size:.95rem}
.sw{overflow:hidden}
.sw .banner{flex:0 0 auto}
.sw .big{font-size:1.4rem}
.clamp{flex:0 0 auto;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.about{margin:10px 0 4px;font-size:.98rem}
svg.still *{animation:none!important}
@media (prefers-reduced-motion:no-preference){
  .eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1s ease-in-out infinite alternate}
  .flt{animation:flt 5s ease-in-out infinite alternate}
  .zz{stroke-dasharray:14 10;animation:zz 3s linear infinite}
  .wv{animation:wv 6s ease-in-out infinite alternate}
  .sun{transform-box:fill-box;transform-origin:center;animation:sun 4s ease-in-out infinite alternate}
  .tw{animation:tw 2.4s ease-in-out infinite alternate}
  .bm{animation:bm 4s ease-in-out infinite alternate}
  .bob{animation:bob .8s ease-in-out infinite alternate}
}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes flt{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes zz{to{stroke-dashoffset:-96}}
@keyframes wv{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes sun{from{transform:scale(.94)}to{transform:scale(1.06)}}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes bm{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.hero2{position:relative;border-radius:20px;overflow:hidden;min-height:260px;color:#fff;display:flex;align-items:flex-end;background:#0b1020}
.heroart{position:absolute;inset:0}.heroart svg{width:100%;height:100%;display:block}
.heroart:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 25%,rgba(0,0,0,.82))}
.herotx{position:relative;z-index:1;padding:18px;display:grid;gap:4px;width:100%}
.herotx small{opacity:.9;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}
.herotx .n{font-family:var(--font-display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.herotx .cprice{color:#fff;margin-top:6px}
.herotx h2{font-family:var(--font-display);margin:0;font-size:1.5rem;line-height:1.1}
.herotx .btn{margin-top:8px;justify-self:start;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sale{display:grid;gap:8px}
.sale .it{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.sale .it b{font-family:var(--font-display)}.sale .it span{color:var(--muted);font-size:.85rem;display:block}
.sale .it em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.seg{display:flex;gap:6px;padding:8px 14px 2px}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.langsel{flex:0 0 auto!important;min-width:0!important;width:auto!important;padding:4px 6px!important;font-size:.78rem;border-radius:8px!important}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:1rem}
.card{border-left:5px solid var(--fc,var(--line))}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:grid;gap:4px}
.hero small{opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}
.hero .n{font-family:var(--font-display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.hero h2{font-family:var(--font-display);margin:0;font-size:1.4rem;line-height:1.1}
.hero .btn{margin-top:8px;justify-self:start;background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.hs>*{flex:0 0 82%;scroll-snap-align:start;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.tile b{font-family:var(--font-display);font-size:1.05rem}
.tile span{color:var(--muted);font-size:.85rem}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Térkép */
#mapwrap{position:absolute;inset:0;background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.mapbtns{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapbtns button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.mapbtns button.txt{width:auto;padding:0 10px;font-size:.78rem;height:34px}
.legend{position:absolute;left:10px;bottom:10px;flex-wrap:nowrap!important;overflow-x:auto;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 9px;display:flex;gap:8px;flex-wrap:wrap;font-size:.72rem;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.mapbtns button.on{background:var(--accent);color:#fff}
.mapcard{position:absolute;left:10px;right:10px;bottom:62px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.mapcard[hidden]{display:none}
.mcart{width:64px;height:64px;border-radius:10px;overflow:hidden;flex:none}
.mcart svg{width:100%;height:100%;display:block}
.mctx{flex:1;min-width:0;font-size:.9rem}.mctx .sm{font-size:.78rem;color:var(--muted)}.mctx .cprice{margin-top:3px;font-size:.82rem}
.mapcard .btn{flex:none;padding:8px 12px}
.mcx{position:absolute;top:2px;right:6px;background:none;border:0;color:var(--muted);font-size:.9rem;cursor:pointer;padding:4px}
.legend button{background:none;border:0;color:inherit;font:inherit;padding:2px 3px;cursor:pointer;border-radius:6px}.legend button[aria-pressed="true"]{background:var(--accent);color:#fff}
.mapnote{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:.75rem;color:var(--muted)}

/* Kártyák */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;grid-template-columns:58px 1fr;gap:12px;cursor:pointer;text-align:left;width:100%}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--bg);padding:6px 0;font-variant-numeric:tabular-nums}
.date b{font-family:var(--font-display);font-size:1.4rem;line-height:1}
.date span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{border-left:5px solid var(--fc,var(--line))}
.cprice{margin-top:8px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.cprice.none{color:var(--muted);font-weight:500;font-size:.85rem}
.card h3{margin:0;font-family:var(--font-display);font-size:1.12rem;line-height:1.15}
.meta{color:var(--muted);font-size:.86rem;margin:2px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.tag.ok{color:var(--good);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.bar{height:5px;border-radius:3px;background:var(--bg);margin-top:10px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
h2.sec{font-family:var(--font-display);font-size:1.3rem;margin:22px 0 8px}
h2.sec:first-child{margin-top:4px}
.list{display:grid;gap:10px}
.empty{color:var(--muted);padding:24px 0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted);font-size:.9rem}
.note b{color:var(--ink)}
.btn{font-weight:700;font-size:.9rem;text-decoration:none;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* Felfedezés (lapozás) */
#deck{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:14px}
#stack{position:relative;flex:1;width:100%;max-width:420px;min-height:260px}
.sw{position:absolute;inset:0 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;touch-action:none;user-select:none;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.sw .big{font-family:var(--font-display);font-weight:800;font-size:1.9rem;line-height:1.05;text-wrap:balance}
.sw .when{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.sw .stamp{position:absolute;top:18px;font-weight:800;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;transform:rotate(-8deg)}
.sw .stamp.yes{right:18px;color:var(--good)}
.sw .stamp.no{left:18px;color:var(--warn)}
.swbtns{display:flex;gap:18px;padding:12px 0 4px}
.swbtns button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;cursor:pointer}
.swbtns .yes{color:var(--good)} .swbtns .no{color:var(--warn)}

/* Lap-sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px 28px;z-index:21;display:none;border:1px solid var(--line)}
#sheet h2{font-family:var(--font-display);font-size:1.5rem;margin:0 28px 2px 0;line-height:1.1}
#sheet .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--muted)}
#sheet h2.sec{margin:22px 0 8px;font-size:1.2rem}
.price{font-variant-numeric:tabular-nums;font-weight:700;margin:8px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.plan label{font-size:.78rem;color:var(--muted);display:grid;gap:3px}
.plan input{width:100%}
.total{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.total.over{border:1px solid var(--warn)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--line);margin:0 6px 6px 0;font-size:.85rem}
.badge.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.q{margin:14px 0}
.q p{font-weight:700;margin:0 0 6px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}

html.v1[data-theme]{--bg:#0b0618;--surface:#150d2b;--ink:#f4efff;--muted:#a79bc9;--line:#2c1f52;--accent:#ff2e93;--accent-ink:#fff;--good:#2ef2c8;--warn:#ffc857;--sea:#0e0a2a;--land:#251a4d;--landline:#4a3a86;--font-display:"Sora",system-ui,sans-serif;--font-body:"DM Sans",system-ui,sans-serif;color-scheme:dark}
html.v1 body{background:radial-gradient(900px 420px at 85% -8%,rgba(255,46,147,.38),transparent 70%),radial-gradient(800px 480px at -10% 25%,rgba(0,229,255,.22),transparent 70%),#0b0618}
html.v1 #theme{display:none}
html.v1 .top h1{background:linear-gradient(90deg,#ff2e93,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.5rem}
html.v1 #filters{border-bottom:0}
html.v1 .chip{background:rgba(255,255,255,.04);border-color:#3a2a6b}
html.v1 .chip[aria-pressed="true"]{background:linear-gradient(90deg,#ff2e93,#7c4dff);color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(255,46,147,.55)}
html.v1 .btn.primary{background:linear-gradient(90deg,#ff2e93,#7c4dff);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(255,46,147,.35)}
html.v1 .card{grid-template-columns:1fr;gap:0;padding:0;overflow:hidden;border:1px solid #3a2a6b;border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px rgba(255,46,147,.12)}
html.v1 .card .date.art{height:158px;border-radius:0;flex-direction:row;align-items:flex-end;justify-content:flex-start;gap:8px;padding:12px 14px}
html.v1 .card .date.art b{font-size:2.3rem}
html.v1 .card .date.art span{font-size:.9rem;padding-bottom:4px}
html.v1 .card>div:last-child{padding:12px 14px 14px}
html.v1 .hs>*{flex-basis:78%}
html.v1 .hero2{border-radius:30px;box-shadow:0 0 40px rgba(255,46,147,.35);min-height:290px}
html.v1 .tile{background:linear-gradient(145deg,#1d1240,#150d2b);border-color:#3a2a6b;border-radius:20px}
html.v1 nav{margin:0 14px calc(12px + env(safe-area-inset-bottom,0));border:1px solid #3a2a6b;border-radius:999px;background:rgba(21,13,43,.88);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
html.v1 nav button[aria-current="page"]{color:#ff2e93;text-shadow:0 0 12px rgba(255,46,147,.8)}
html.v1 h2.sec{letter-spacing:-.01em}
</style>
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png"><link rel="icon" type="image/png" href="icon-192-v2.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0b0618"></head>
<body>
<div id="app">
  <div class="top"><h1>Festival Map</h1><small id="asof"></small><select id="lang" aria-label="Language" class="langsel"></select><button class="themebtn" id="theme" aria-label="Világos és sötét téma váltása"></button></div>
  <section id="filters" aria-label="Szűrők">
    <div class="row">
      <input type="search" id="q" placeholder="Pl. 50 ezer július elektronikus" aria-label="Keresés és kérdező">
      <select id="genre" aria-label="Műfaj"><option value="">Minden műfaj</option></select>
    </div>
    <div class="row" id="months" role="group" aria-label="Hónap"></div>
    <div class="hint" id="parsed" aria-live="polite"></div>
  </section>
  <main id="view"></main>
  <nav id="nav" aria-label="Nézetek"></nav>
</div>
<div id="sheetbg"></div>
<aside id="sheet" role="dialog" aria-modal="true" aria-label="Fesztivál részletei"></aside>

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const MPFX=(()=>{const r=[];for(let m=0;m<12;m++){const set=new Set();for(const tag of [LANGTAG,"en-GB","hu-HU"]){set.add(norm(new Intl.DateTimeFormat(tag,{month:"long"}).format(new Date(2027,m,15))).slice(0,3));}r.push([...set]);}return r;})();
const UNITS=[["ft",1],["huf",1],["eur",362],["€",362],["euro",362],["gbp",421],["£",421],["usd",313],["$",313],["pln",85],["zl",85],["zł",85],["czk",14.9],["kc",14.9],["chf",385],["sek",33],["nok",31],["dkk",48.5],["aud",205]];
const GENRE_RX=[[/elektro\w*|electro\w*|techno|edm|house|tanczene\w*|dance/,"elektronikus"],[/rock\w*|metal\w*|punk\w*/,"rock"],[/\bpop\b|slager\w*|hits?\b/,"pop"],[/retro\w*/,"retro"],[/egyetem\w*|diak\w*|student\w*|studen\w*|universit\w*|etudiant\w*|studenck\w*/,"egyetemista"],[/indie|alternat\w*/,"alternatív"],[/\bs[ií]\w*|hegy\w*|havas|\bski\w*|snow\w*|esqu\w*|sci\b|narty|esqui/,"sí"]];
function parseQuery(q){
  const t=norm(q);const out={budget:0,month:0,tag:"",where:"",text:t};
  let m=t.match(/(\d[\d\s.,]*)\s*(ezer|e\s?ft|k\b|ft|huf|eur\w*|€|gbp|£|usd|\$|pln|zl|czk|kc|chf|sek|nok|dkk|aud)?/);
  if(m&&m[2]){let n=Number(m[1].replace(/[\s.,]/g,""));const u=m[2];let mult=1;if(/ezer|e\s?ft|^k$/.test(u))mult=1000;let rate=RATE;if(!/ezer|^k$/.test(u)){const f=UNITS.find(x=>u.startsWith(x[0]));if(f)rate=f[1];}
    out.budget=n*mult*rate;out.text=out.text.replace(m[0],"");}
  else if(CUR==="HUF"){m=t.match(/\b(\d{5,7})\b/);if(m){out.budget=Number(m[1]);out.text=out.text.replace(m[0],"");}}
  for(let i=0;i<12&&!out.month;i++){for(const pf of MPFX[i]){const r=new RegExp("\\b"+pf+"\\w*");if(r.test(out.text)){out.month=i+1;out.text=out.text.replace(r,"");break;}}}
  for(const[r,v]of GENRE_RX){if(r.test(out.text)){out.tag=v;out.text=out.text.replace(r,"");break;}}
  if(/kulfold|abroad|foreign|ausland|extranjer|etranger|estero|zagranic|estrangeir/.test(out.text)){out.where="kulfold";out.text=out.text.replace(/kulfold\w*|abroad|foreign|ausland|extranjer\w*|etranger|estero|zagranic\w*|estrangeir\w*/,"");}
  else if(/belfold|hazai|magyar|domestic|inland|nacional|national|nazional|krajow/.test(out.text)){out.where="belfold";out.text=out.text.replace(/belfold\w*|hazai|magyar\w*|domestic|inland|nacional\w*|national\w*|nazional\w*|krajow\w*/,"");}
  out.text=out.text.replace(/\s+/g," ").trim();return out;
}

  sc.append(qb);const res=el("div");const go=el("button","btn primary",T("Mutasd a legjobbakat"));go.onclick=()=>{
    res.replaceChildren();const sc2=FESTS.map(f=>{let s=0;if(ans[0]&&f.tags.includes(ans[0]))s+=3;if(ans[1]&&ans[1]!=="*"&&f.type===ans[1])s+=2;if(ans[2]){const lim=Number(ans[2]);if(!f.huf||f.huf<=lim)s+=2;}return[f,s];}).sort((a,b)=>b[1]-a[1]||a[0].s.localeCompare(b[0].s)).slice(0,3);

  const gw=el("div","actions");gw.append(go);sc.append(gw);res.className="list";res.style.marginTop="10px";sc.append(res);

  const n=el("div","note");n.append(el("b",null,T("Szerverre váró funkciók: ")),document.createTextNode(T("tényleges értesítések, barátok és közös csoportok, fuvarmegosztás, értékelések, élő jegyár-követés és az összes fesztivál a világon. Ezekhez adatbázis és háttérszolgáltatás kell, ez az app jelenleg csak a telefonodon tárolja az adataidat.")));sc.append(n);
  root.append(sc);

/* ===== Nézetváltás ===== */
function go(h){location.hash=h;}
function quick(q){S.q="";S.where=q.where||"";S.month=q.month||0;S.genre=q.tag||"";$("genre").value=q.tag||"";S.mode="lista";save("fm_mode","lista");buildMonths();go("fesztivalok");}
function viewHome(root){
  const sc=el("div","scroll");
  const up=FESTS.filter(f=>daysUntil(f.sd)>0).sort((a,b)=>a.s.localeCompare(b.s));
  const nx=up[0];

    const b=el("button","btn",T("Részletek"));b.onclick=()=>openSheet(nx.id);tx.append(b);h.append(art,tx);sc.append(h);

  if(sl.length){sc.append(el("h2","sec",T("Jegyeladás-figyelő")));const bx=el("div","sale");
    sl.forEach(x=>{const b=el("button","it");const l=el("div");l.append(el("b",null,x.f.n),el("span",null,T(x.s.t)+" · "+(LANG==="hu"?x.s.d.replace(/-/g,". ")+".":new Intl.DateTimeFormat(LANGTAG,{day:"numeric",month:"long",year:"numeric"}).format(parse(x.s.d)))));b.append(l,el("em",null,T("{n} nap",{n:daysUntil(parse(x.s.d))})));b.onclick=()=>openSheet(x.f.id);bx.append(b);});
    sc.append(bx,el("div","hint",T("Csak azt mutatja, aminek a dátuma ismert. A többi fesztiválnál még nincs közzétett eladási időpont.")));
  }
  sc.append(el("h2","sec",T("Mit keresel?")));
  const ch=el("div","row");
  [["Belföld",{where:"belfold"}],["Külföld",{where:"kulfold"}],["Elektronikus",{tag:"elektronikus"}],["Rock",{tag:"rock"}],["Pop",{tag:"pop"}],["Egyetemista",{tag:"egyetemista"}],["Retro",{tag:"retro"}],["Sífesztivál",{tag:"sí"}],["Június",{month:6}],["Július",{month:7}],["Augusztus",{month:8}]].filter(([l,q])=>!(q.where&&!HOME.cc)).forEach(([l,q])=>{const c=el("button","chip",q.month?MONTHS[q.month-1][0].toUpperCase()+MONTHS[q.month-1].slice(1):T(l));c.onclick=()=>quick(q);ch.append(c);});
  sc.append(ch);
  sc.append(el("h2","sec","Hamarosan"));
  const hs=el("div","hs");up.slice(0,7).forEach(f=>hs.append(card(f)));sc.append(hs);
  sc.append(el("h2","sec",T("Fedezz fel")));
  const tl=el("div","tiles");
  [["Lapozz","Jobbra húzod, ami tetszik","felfedezes"],["Térkép","Hol mi van a világban","terkep"],["Lista","Az egész nyár egy listában","naptar"],["Bulis térkép","Hol voltál már?","profil"]].forEach(([t,s,h])=>{const b=el("button","tile");b.append(el("b",null,T(t)),el("span",null,T(s)));b.onclick=()=>go(h);tl.append(b);});
  sc.append(tl);

  const n=el("div","note");n.style.marginTop="18px";n.append(el("b",null,T("Hogyan működik? ")),document.createTextNode(T("Minden fesztiválnál a hivatalos jegyoldalra visz tovább az app, a vásárlás mindig a szervezőnél történik. A dátumokat vásárlás előtt ellenőrizd.")));sc.append(n);
  root.append(sc);
}

function buildNav(){

  root.style.display="flex";root.style.flexDirection="column";

  $("filters").style.display=(v.filters&&!(v.id==="fesztivalok"&&S.mode==="lapozas"))?"grid":"none";

  if(v.id==="terkep"){
    if(!mapEl||!root.contains(mapEl)){root.replaceChildren();mapEl=buildMap();root.append(mapEl);focus(13,47.5,110);}
